services:
  web:
    build: .
    image: forgeflow:batch-d
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8787
      WEB_SECURE_COOKIES: "true"
      WEB_PUBLIC_ORIGIN: ${FORGEFLOW_PUBLIC_ORIGIN:-https://${FORGEFLOW_DOMAIN:?Set FORGEFLOW_DOMAIN in deploy.env}}
      WEB_TRUST_PROXY: "true"
      DATABASE_PATH: /app/data/forgeflow.db
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?Set WEB_SESSION_SECRET in deploy.env}
      WEB_SESSION_TTL_SECONDS: ${WEB_SESSION_TTL_SECONDS:-604800}
      WEB_GUEST_SESSION_RATE_LIMIT_PER_MINUTE: ${WEB_GUEST_SESSION_RATE_LIMIT_PER_MINUTE:-20}
      WEB_GUEST_TASK_RATE_LIMIT_PER_MINUTE: ${WEB_GUEST_TASK_RATE_LIMIT_PER_MINUTE:-10}
      WEB_MAX_ACTIVE_TASKS: ${WEB_MAX_ACTIVE_TASKS:-2}
      WEB_DAILY_TASK_LIMIT: ${WEB_DAILY_TASK_LIMIT:-25}
      WEB_GUEST_DAILY_MODEL_TASK_LIMIT: ${WEB_GUEST_DAILY_MODEL_TASK_LIMIT:-5}
      WEB_DEFAULT_MODEL_TURNS: ${WEB_DEFAULT_MODEL_TURNS:-8}
      WEB_DEFAULT_TOOL_CALLS: ${WEB_DEFAULT_TOOL_CALLS:-20}
      WEB_DEFAULT_TOKEN_BUDGET: ${WEB_DEFAULT_TOKEN_BUDGET:-50000}
      WEB_APPROVAL_TIMEOUT_MS: ${WEB_APPROVAL_TIMEOUT_MS:-300000}
      WEB_ALLOW_PAID_PROVIDER: ${WEB_ALLOW_PAID_PROVIDER:-false}
      WEB_GLOBAL_PROVIDER_CONCURRENCY: ${WEB_GLOBAL_PROVIDER_CONCURRENCY:-2}
      WEB_GLOBAL_MODEL_TOKEN_BUDGET_PER_DAY: ${WEB_GLOBAL_MODEL_TOKEN_BUDGET_PER_DAY:-0}
      WEB_ENABLE_PUBLIC_EVALUATION_RUN: ${WEB_ENABLE_PUBLIC_EVALUATION_RUN:-false}
      WEB_EVALUATION_RUNS_PER_HOUR: ${WEB_EVALUATION_RUNS_PER_HOUR:-3}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-mock-model}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONTEXT_MAX_TOKENS: ${LLM_CONTEXT_MAX_TOKENS:-16384}
      LLM_CONTEXT_RESERVED_COMPLETION_TOKENS: ${LLM_CONTEXT_RESERVED_COMPLETION_TOKENS:-2048}
      LLM_TOOL_RESULT_MAX_TOKENS: ${LLM_TOOL_RESULT_MAX_TOKENS:-1024}
      LOOP_GUARD_REPEAT_THRESHOLD: ${LOOP_GUARD_REPEAT_THRESHOLD:-3}
      LOOP_GUARD_CYCLE_REPETITIONS: ${LOOP_GUARD_CYCLE_REPETITIONS:-3}
      LOOP_GUARD_FAILURE_THRESHOLD: ${LOOP_GUARD_FAILURE_THRESHOLD:-3}
      LOOP_GUARD_MAX_HISTORY_ROUNDS: ${LOOP_GUARD_MAX_HISTORY_ROUNDS:-12}
    volumes:
      - forgeflow_data:/app/data
    expose:
      - "8787"
    stop_grace_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      FORGEFLOW_DOMAIN: ${FORGEFLOW_DOMAIN:?Set FORGEFLOW_DOMAIN in deploy.env}
    ports:
      - "${FORGEFLOW_HTTP_PORT:-80}:80"
      - "${FORGEFLOW_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  forgeflow_data:
  caddy_data:
  caddy_config:
